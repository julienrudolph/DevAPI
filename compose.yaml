name: devapi

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL}
      PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      OIDC_PROVIDER: ${OIDC_PROVIDER:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-true}
      PASSWORD_SIGNUP_ENABLED: ${PASSWORD_SIGNUP_ENABLED:-true}
      MAGIC_LINK_AUTH_ENABLED: ${MAGIC_LINK_AUTH_ENABLED:-false}
      PROXY_INTERNAL_URL: http://proxy:3002
      PROXY_INTERNAL_TOKEN: ${PROXY_INTERNAL_TOKEN}
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    restart: unless-stopped
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 3002
      PROXY_INTERNAL_TOKEN: ${PROXY_INTERNAL_TOKEN}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)})"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - egress

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
  egress:
    driver: bridge
