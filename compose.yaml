name: devapi

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL}
      PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      OIDC_PROVIDER: ${OIDC_PROVIDER:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-true}
      PASSWORD_SIGNUP_ENABLED: ${PASSWORD_SIGNUP_ENABLED:-true}
      MAGIC_LINK_AUTH_ENABLED: ${MAGIC_LINK_AUTH_ENABLED:-false}
      PROXY_INTERNAL_URL: http://proxy:3002
      PROXY_INTERNAL_TOKEN: ${PROXY_INTERNAL_TOKEN}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      EXECUTION_RATE_WINDOW_MS: ${EXECUTION_RATE_WINDOW_MS:-60000}
      EXECUTION_RATE_PER_USER: ${EXECUTION_RATE_PER_USER:-60}
      EXECUTION_RATE_PER_WORKSPACE: ${EXECUTION_RATE_PER_WORKSPACE:-300}
      EXECUTION_CONCURRENCY_PER_USER: ${EXECUTION_CONCURRENCY_PER_USER:-3}
      EXECUTION_CONCURRENCY_PER_WORKSPACE: ${EXECUTION_CONCURRENCY_PER_WORKSPACE:-10}
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)})"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    restart: unless-stopped
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 3002
      PROXY_INTERNAL_TOKEN: ${PROXY_INTERNAL_TOKEN}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROXY_MAX_CONCURRENT_REQUESTS: ${PROXY_MAX_CONCURRENT_REQUESTS:-50}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/ready').then(r=>{if(!r.ok)process.exit(1)})"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - egress

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
  egress:
    driver: bridge
